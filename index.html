<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Grade Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="wrap header-row">
      <h1>Grade Calculator</h1>
      <div class="header-actions">
        <button type="button" class="btn btn-quiet" data-action="export">Export</button>
        <button type="button" class="btn btn-quiet" data-action="import">Import</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
    </div>
    <nav class="wrap tabs" role="tablist" aria-label="Courses" id="tabs"></nav>
  </header>

  <main class="wrap" id="panels"></main>

  <footer class="wrap app-footer">
    <p>Marks are saved automatically on this device only. Use Export to back them up or move them to another device.</p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
