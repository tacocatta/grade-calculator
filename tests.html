<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Grade Calculator Tests</title>
  <style>
    :root { --bg: #f4f5f7; --text: #1b1f24; --muted: #5d6673; --pass: #1f7a45; --fail: #c0352b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111418; --text: #e8eaed; --muted: #9aa3ae; --pass: #6fcf97; --fail: #f08a80; }
    }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
    main { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 1.3rem; }
    .summary { font-weight: 700; font-size: 1.1rem; }
    .summary.ok { color: var(--pass); } .summary.bad { color: var(--fail); }
    ul { list-style: none; padding: 0; }
    li { padding: 4px 0; border-bottom: 1px solid rgba(127, 127, 127, 0.2); }
    .tag { display: inline-block; width: 3.2em; font-weight: 700; }
    .pass .tag { color: var(--pass); } .fail .tag { color: var(--fail); }
    .msg { display: block; color: var(--fail); margin-left: 3.2em; font-size: 0.9rem; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Grade Calculator Tests</h1>
    <p><a href="index.html">← Back to the calculator</a></p>
    <p class="summary" id="summary">Running…</p>
    <ul id="list"></ul>
  </main>
  <script src="calc.js"></script>
  <script src="tests/calc.test.js"></script>
  <script>
    (function () {
      var results = window.TEST_RESULTS || [];
      var passed = results.filter(function (r) { return r.pass; }).length;
      var summary = document.getElementById('summary');
      summary.textContent = passed + ' / ' + results.length + ' tests passed';
      summary.className = 'summary ' + (passed === results.length ? 'ok' : 'bad');
      document.getElementById('list').innerHTML = results.map(function (r) {
        var esc = function (s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); };
        return '<li class="' + (r.pass ? 'pass' : 'fail') + '"><span class="tag">' + (r.pass ? 'PASS' : 'FAIL') + '</span>' +
          esc(r.name) + (r.pass ? '' : '<span class="msg">' + esc(r.message) + '</span>') + '</li>';
      }).join('');
    })();
  </script>
</body>
</html>
